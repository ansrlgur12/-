# 직좌우 게임 서버 (jjw.kihyuk.site → 127.0.0.1:4000)
# /etc/nginx/sites-available/jjw.kihyuk.site 에 두고 sites-enabled에 연결한 뒤
# certbot --nginx -d jjw.kihyuk.site 로 HTTPS를 붙인다 (certbot이 443 설정을 이 파일에 더해 준다)
# (map 변수 이름은 다른 사이트 설정과 겹치지 않게 jjw_ 를 붙였다)

map $http_upgrade $jjw_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name jjw.kihyuk.site;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # socket.io(실시간 방·게임)는 WebSocket으로 업그레이드한다
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jjw_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 게임 중 연결은 오래 열려 있다
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 지도 타일은 서버가 이미 gzip으로 보낸다
        gzip off;
    }
}
